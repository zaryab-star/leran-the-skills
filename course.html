<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course | Leran the skills</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="course-page">
    <a href="index.html" class="back-button">
  <span class="back-arrow">←</span>
  <span>Back to Courses</span>
</a>
    <header class="course-hero">
      <span class="course-kicker">LEARN • PRACTISE • GROW</span>
      <h1 id="courseTitle">Loading course...</h1>
      <p id="courseDescription"></p>
    </header>
    <div id="progress" class="course-progress" aria-live="polite"></div>
    <section id="lessons" aria-label="Course lessons"></section>
  </main>
  <script src="course.js"></script>

<script type="module">
  import { auth } from "./firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  // Course ko login ke baghair access karne se roko
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.replace("./login.html");
    }
  });
</script>
</body>
</html>
